<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--tg-theme-text-color, #000000);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #666666);
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--tg-theme-hint-color, #dadada);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--tg-theme-button-color, #40a7e3);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 24px 0 16px 0;
            color: var(--tg-theme-text-color, #000000);
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin: 16px 0 8px 0;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            text-align: center;
            font-size: 14px;
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            display: none;
        }

        .status-message.success {
            background: rgba(39, 174, 96, 0.1);
            color: #27ae60;
            display: block;
        }

        .status-message.error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            display: block;
        }

        .status-message.loading {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-hint-color, #666666);
            display: block;
        }

        .price-inputs {
            display: flex;
            gap: 12px;
        }

        .price-inputs .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .separator {
            height: 1px;
            background: var(--tg-theme-hint-color, #e0e0e0);
            margin: 16px 0;
            opacity: 0.3;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>📊 Arbitrage Calculator</h1>

        <!-- Long Position -->
        <div class="section-title">📈 Long Position</div>
        
        <div class="form-group">
            <label for="longExchange">Биржа (Long)</label>
            <select id="longExchange" required>
                <option value="" disabled selected>Выберите биржу</option>
                <option value="Binance">Binance</option>
                <option value="Bybit">Bybit</option>
                <option value="OKX">OKX</option>
                <option value="Gate">Gate</option>
                <option value="MEXC">MEXC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="longPrice">Цена (Long)</label>
            <input type="number" id="longPrice" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="separator"></div>

        <!-- Short Position -->
        <div class="section-title">📉 Short Position</div>

        <div class="form-group">
            <label for="shortExchange">Биржа (Short)</label>
            <select id="shortExchange" required>
                <option value="" disabled selected>Выберите биржу</option>
                <option value="Binance">Binance</option>
                <option value="Bybit">Bybit</option>
                <option value="OKX">OKX</option>
                <option value="Gate">Gate</option>
                <option value="MEXC">MEXC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="shortPrice">Цена (Short)</label>
            <input type="number" id="shortPrice" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="separator"></div>

        <!-- Volume -->
        <div class="section-title">💰 Volume</div>
        
        <div class="form-group">
            <label for="volume">Объем</label>
            <input type="number" id="volume" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <!-- Submit Button -->
        <button id="submitBtn" onclick="submitForm()">Отправить</button>

        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        
        // Инициализация Mini App
        tg.expand(); // Разворачиваем на весь экран
        tg.MainButton.hide(); // Скрываем основную кнопку Telegram, используем свою
        
        // Настройка цветов темы
        document.body.style.background = tg.themeParams.bg_color || '#ffffff';
        document.body.style.color = tg.themeParams.text_color || '#000000';

        // Функция для получения CSRF токена (если нужен)
        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        }

        // Функция валидации формы
        function validateForm() {
            const longExchange = document.getElementById('longExchange').value;
            const longPrice = document.getElementById('longPrice').value;
            const shortExchange = document.getElementById('shortExchange').value;
            const shortPrice = document.getElementById('shortPrice').value;
            const volume = document.getElementById('volume').value;

            if (!longExchange || !longPrice || !shortExchange || !shortPrice || !volume) {
                throw new Error('Пожалуйста, заполните все поля');
            }

            if (parseFloat(longPrice) <= 0 || parseFloat(shortPrice) <= 0 || parseFloat(volume) <= 0) {
                throw new Error('Цены и объем должны быть больше нуля');
            }

            return {
                longExchange,
                longPrice: parseFloat(longPrice),
                shortExchange,
                shortPrice: parseFloat(shortPrice),
                volume: parseFloat(volume)
            };
        }

        // Функция отправки данных в n8n
        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            try {
                // Валидация
                const formData = validateForm();
                
                // Блокируем кнопку
                submitBtn.disabled = true;
                
                // Показываем статус загрузки
                statusDiv.className = 'status-message loading';
                statusDiv.textContent = 'Отправка данных...';

                // Добавляем метаданные Telegram
                const payload = {
                    ...formData,
                    telegram_init_data: tg.initData || '',
                    user: tg.initDataUnsafe?.user || null,
                    timestamp: new Date().toISOString()
                };

                // Отправка POST запроса в n8n
                // ЗАМЕНИТЕ ЭТОТ URL НА ВАШ WEBHOOK URL ИЗ N8N
                const response = await fetch('https://your-n8n-webhook-url.com/webhook/your-endpoint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': getCsrfToken()
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                // Успешная отправка
                statusDiv.className = 'status-message success';
                statusDiv.textContent = '✅ Данные успешно отправлены!';
                
                // Вибрация на телефоне (если поддерживается)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                
                // Очистка формы (опционально)
                // document.getElementById('longExchange').value = '';
                // document.getElementById('longPrice').value = '';
                // document.getElementById('shortExchange').value = '';
                // document.getElementById('shortPrice').value = '';
                // document.getElementById('volume').value = '';

            } catch (error) {
                console.error('Error:', error);
                
                // Показываем ошибку
                statusDiv.className = 'status-message error';
                statusDiv.textContent = `❌ Ошибка: ${error.message}`;
                
                // Вибрация на телефоне (если поддерживается)
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                // Разблокируем кнопку через небольшую задержку
                setTimeout(() => {
                    submitBtn.disabled = false;
                }, 2000);
            }
        }

        // Добавляем поддержку Enter для отправки формы
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitForm();
            }
        });

        // Закрываем Mini App при необходимости
        function closeApp() {
            tg.close();
        }

        // Показываем предупреждение при попытке закрыть страницу
        window.addEventListener('beforeunload', function (e) {
            if (document.getElementById('submitBtn').disabled) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
