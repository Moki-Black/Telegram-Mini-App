<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arbitrage Form · TMA</title>
    <!-- Telegram Web App styles hint -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #f8f9fc);
            color: var(--tg-theme-text-color, #1c1e2a);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 16px;
            margin: 0;
            transition: background 0.2s ease;
        }

        .form-card {
            background: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 24px;
            padding: 22px 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            border: 1px solid var(--tg-theme-hint-color, rgba(0,0,0,0.04));
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 24px;
            padding-left: 4px;
            color: var(--tg-theme-text-color, #1c1e2a);
        }

        .field-group {
            margin-bottom: 24px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 15px;
            color: var(--tg-theme-hint-color, #6d7a8f);
        }

        .field-label span {
            opacity: 0.7;
        }

        input, select {
            width: 100%;
            padding: 16px 14px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #f2f5fa);
            border: 1.5px solid transparent;
            border-radius: 18px;
            outline: none;
            color: var(--tg-theme-text-color, #1c1e2a);
            transition: border 0.1s, background 0.2s;
            font-weight: 450;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%236d7a8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
        }

        input:focus, select:focus {
            border-color: var(--tg-theme-button-color, #40a7e3);
            background: var(--tg-theme-secondary-bg-color, #ffffff);
        }

        .double-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .double-row .field-group {
            flex: 1 1 calc(50% - 7px);
            min-width: 140px;
        }

        .submit-btn {
            width: 100%;
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 18px;
            padding: 18px 14px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(0,100,200,0.2);
            transition: opacity 0.15s, transform 0.1s;
            cursor: pointer;
        }

        .submit-btn:active {
            transform: scale(0.98);
            opacity: 0.85;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .status-message {
            margin-top: 16px;
            text-align: center;
            font-size: 15px;
            font-weight: 480;
            color: var(--tg-theme-hint-color, #526069);
            background: var(--tg-theme-secondary-bg-color, #eef2f6);
            padding: 12px;
            border-radius: 40px;
            display: none;
        }

        .status-message.show {
            display: block;
        }

        .token-input-wrapper {
            position: relative;
        }

        .token-symbol {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tg-theme-hint-color, #888);
            font-weight: 500;
            pointer-events: none;
        }

        /* Telegram bottom safe area */
        .spacer {
            height: 10px;
        }
    </style>
    <!-- Telegram WebApp library -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="form-card">
        <h1>📊 Arbitrage · Scanner</h1>

        <!-- основная форма -->
        <form id="arbForm">
            <!-- название токена (обязательное) -->
            <div class="field-group">
                <div class="field-label"><span>🪙</span> Название токена</div>
                <div class="token-input-wrapper">
                    <input type="text" id="tokenName" name="tokenName" placeholder="например, NOT, DOGS, BTC" autocomplete="off" required>
                </div>
            </div>

            <!-- Long биржа + цена (два в ряд) -->
            <div class="double-row">
                <div class="field-group">
                    <div class="field-label"><span>📈 Long</span> Биржа</div>
                    <select id="longExchange" name="longExchange" required>
                        <option value="" disabled selected>— выбрать —</option>
                        <option value="Binance">Binance</option>
                        <option value="Bybit">Bybit</option>
                        <option value="OKX">OKX</option>
                        <option value="Gate">Gate</option>
                        <option value="MEXC">MEXC</option>
                    </select>
                </div>
                <div class="field-group">
                    <div class="field-label"><span>💰</span> Цена Long</div>
                    <input type="number" id="longPrice" name="longPrice" step="any" placeholder="0.00" required>
                </div>
            </div>

            <!-- Short биржа + цена (два в ряд) -->
            <div class="double-row">
                <div class="field-group">
                    <div class="field-label"><span>📉 Short</span> Биржа</div>
                    <select id="shortExchange" name="shortExchange" required>
                        <option value="" disabled selected>— выбрать —</option>
                        <option value="Binance">Binance</option>
                        <option value="Bybit">Bybit</option>
                        <option value="OKX">OKX</option>
                        <option value="Gate">Gate</option>
                        <option value="MEXC">MEXC</option>
                    </select>
                </div>
                <div class="field-group">
                    <div class="field-label"><span>💎</span> Цена Short</div>
                    <input type="number" id="shortPrice" name="shortPrice" step="any" placeholder="0.00" required>
                </div>
            </div>

            <!-- объем (отдельно) -->
            <div class="field-group">
                <div class="field-label"><span>📦</span> Объем (токенов)</div>
                <input type="number" id="volume" name="volume" step="any" placeholder="например 1250.5" required>
            </div>

            <!-- кнопка отправки -->
            <button type="submit" class="submit-btn" id="sendBtn">🚀 Отправить</button>
        </form>

        <!-- статус сообщение (обратная связь) -->
        <div class="status-message" id="statusMsg"></div>
    </div>
    <div class="spacer"></div>

    <script>
        (function() {
            // --- Telegram WebApp integration ---
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.expand();                // растянуть на весь экран
                tg.enableClosingConfirmation(); // предупреждение при закрытии (опционально)
                tg.ready();                  // сообщаем, что приложение готово
                // фон автоматически подстраивается под тему, используем CSS переменные
            }

            // элементы формы
            const form = document.getElementById('arbForm');
            const tokenInput = document.getElementById('tokenName');
            const longExchange = document.getElementById('longExchange');
            const longPrice = document.getElementById('longPrice');
            const shortExchange = document.getElementById('shortExchange');
            const shortPrice = document.getElementById('shortPrice');
            const volume = document.getElementById('volume');
            const submitBtn = document.getElementById('sendBtn');
            const statusDiv = document.getElementById('statusMsg');

            // URL твоего n8n вебхука (по условию)
            const WEBHOOK_URL = 'https://gitnickolay.app.n8n.cloud/webhook-test/e9b928a3-3361-455a-a4bd-541d8fddf0a3';

            // Вспомогательная функция: показать статус (успех/ошибка)
            function setStatus(message, isError = false) {
                statusDiv.textContent = message;
                statusDiv.classList.add('show');
                // можно слегка стилизовать ошибку (но используем стандартные цвета темы)
                if (isError) {
                    statusDiv.style.background = 'rgba(255, 80, 80, 0.15)';
                    statusDiv.style.color = 'var(--tg-theme-text-color, #c42e2e)';
                } else {
                    // сброс к теме
                    statusDiv.style.background = 'var(--tg-theme-secondary-bg-color, #eef2f6)';
                    statusDiv.style.color = 'var(--tg-theme-hint-color, #2e5a3b)';
                }
            }

            // Очистка статуса перед новым запросом
            function clearStatus() {
                statusDiv.classList.remove('show');
                statusDiv.textContent = '';
            }

            // Валидация: все поля должны быть заполнены (HTML5 required уже помогает)
            function validateForm() {
                if (!tokenInput.value.trim()) return false;
                if (!longExchange.value) return false;
                if (!longPrice.value || isNaN(longPrice.value) || longPrice.value === '') return false;
                if (!shortExchange.value) return false;
                if (!shortPrice.value || isNaN(shortPrice.value) || shortPrice.value === '') return false;
                if (!volume.value || isNaN(volume.value) || volume.value === '') return false;
                return true;
            }

            // Функция отправки данных через POST (JSON)
            async function sendData(payload) {
                try {
                    // показать состояние загрузки
                    submitBtn.disabled = true;
                    submitBtn.textContent = '⏳ Отправка...';
                    clearStatus();

                    const response = await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // можно добавить заголовок, если n8n хочет видеть источник
                            'X-TMA-Source': 'arbitrage-form'
                        },
                        body: JSON.stringify(payload)
                    });

                    // проверка ответа
                    let responseText = '';
                    let responseOk = response.ok;

                    // пытаемся прочитать тело (может быть пустое или не json)
                    try {
                        const clonedResponse = response.clone();
                        const json = await clonedResponse.json();
                        responseText = JSON.stringify(json);
                    } catch (e) {
                        // если не json, читаем как текст
                        try {
                            responseText = await response.text();
                        } catch (textErr) {
                            responseText = ' (нет тела)';
                        }
                    }

                    if (responseOk) {
                        setStatus('✅ Данные успешно отправлены!', false);
                        // можно слегка очистить форму? – по желанию оставим как есть.
                        // если нужно сбросить: form.reset(); 
                        // но арбитражник возможно захочет оставить, поэтому не сбрасываем.
                    } else {
                        setStatus(`❌ Ошибка сервера (${response.status})`, true);
                        console.error('Webhook error:', response.status, responseText);
                    }
                } catch (error) {
                    setStatus(`⚠️ Ошибка сети: ${error.message}`, true);
                    console.error('Fetch failed:', error);
                } finally {
                    // восстановить кнопку
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Отправить';
                }
            }

            // Обработчик сабмита формы
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); // отключаем перезагрузку

                if (!validateForm()) {
                    setStatus('❗ Заполните все поля корректно', true);
                    return;
                }

                // Собираем данные согласно заданию:
                // названия токена, long биржа, цена long, short биржа, цена short, объем.
                // Добавляем также метку времени и инициатора (Telegram init data, если нужно)
                const formData = {
                    token: tokenInput.value.trim(),
                    longExchange: longExchange.value,
                    longPrice: parseFloat(longPrice.value),   // число
                    shortExchange: shortExchange.value,
                    shortPrice: parseFloat(shortPrice.value), // число
                    volume: parseFloat(volume.value),         // число
                    timestamp: new Date().toISOString(),
                    // полезно добавить информацию о пользователе из Telegram, если доступно
                };

                // Если Telegram WebApp передает данные пользователя — добавим их (необязательно)
                if (tg && tg.initDataUnsafe?.user) {
                    const user = tg.initDataUnsafe.user;
                    formData.telegramUser = {
                        id: user.id,
                        firstName: user.first_name,
                        lastName: user.last_name,
                        username: user.username,
                        languageCode: user.language_code
                    };
                }

                // Отправка на вебхук
                await sendData(formData);

                // После успеха можно вибрировать (если поддерживается)
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notification('success');
                }
            });

            // Дополнительно: живая подсказка при потере фокуса на цене (clean)
            [longPrice, shortPrice, volume].forEach(field => {
                field.addEventListener('blur', () => {
                    if (field.value !== '' && isNaN(parseFloat(field.value))) {
                        field.style.borderColor = '#ff7979';
                    } else {
                        field.style.borderColor = ''; // вернуть как при focus
                    }
                });
                field.addEventListener('focus', () => {
                    field.style.borderColor = ''; // сброс ручной подсветки
                });
            });

            // необязательно: скрываем статус при начале печатания
            form.addEventListener('input', () => {
                if (statusDiv.classList.contains('show')) {
                    // не удаляем мгновенно, можно просто затухание
                }
            });

            // принудительно показываем статус в случае невалидной отправки
            // так же можно установить параметры темы, но они уже работают через CSS
            console.log('Telegram Mini App ready · Arb form');
        })();
    </script>
</body>
</html>
