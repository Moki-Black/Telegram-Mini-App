<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--tg-theme-hint-color, #666666);
        }

        select, input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--tg-theme-hint-color, #dadada);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--tg-theme-button-color, #40a7e3);
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 24px 0 16px 0;
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .section-icon {
            font-size: 20px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #40a7e3);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin: 16px 0 8px 0;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            text-align: center;
            font-size: 14px;
            margin-top: 12px;
            padding: 8px;
            border-radius: 8px;
            display: none;
        }

        .status-message.success {
            background: rgba(39, 174, 96, 0.1);
            color: #27ae60;
            display: block;
        }

        .status-message.error {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            display: block;
        }

        .status-message.loading {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-hint-color, #666666);
            display: block;
        }

        .separator {
            height: 1px;
            background: var(--tg-theme-hint-color, #e0e0e0);
            margin: 16px 0;
            opacity: 0.3;
        }

        .token-input {
            margin-bottom: 16px;
        }

        .token-suggestions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .token-suggestion {
            padding: 6px 12px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            color: var(--tg-theme-text-color, #000000);
        }

        .token-suggestion:hover {
            border-color: var(--tg-theme-button-color, #40a7e3);
            background: var(--tg-theme-bg-color, #ffffff);
        }

        .input-hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-top: 4px;
        }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>📊 Arbitrage Calculator</h1>
        <div class="subtitle">Заполните форму для расчета арбитража</div>

        <!-- Token Field (NEW) -->
        <div class="section-title">
            <span class="section-icon">🪙</span>
            <span>Торговая пара</span>
        </div>

        <div class="form-group token-input">
            <label for="token">Токен / Пара</label>
            <input type="text" id="token" placeholder="Например: BTC/USDT, ETH, SOL" required>
            <div class="token-suggestions">
                <span class="token-suggestion" onclick="setToken('BTC/USDT')">BTC/USDT</span>
                <span class="token-suggestion" onclick="setToken('ETH/USDT')">ETH/USDT</span>
                <span class="token-suggestion" onclick="setToken('SOL/USDT')">SOL/USDT</span>
                <span class="token-suggestion" onclick="setToken('BNB/USDT')">BNB/USDT</span>
                <span class="token-suggestion" onclick="setToken('XRP/USDT')">XRP/USDT</span>
            </div>
            <div class="input-hint">Введите название токена или торговую пару</div>
        </div>

        <div class="separator"></div>

        <!-- Long Position -->
        <div class="section-title">
            <span class="section-icon">📈</span>
            <span>Long Position</span>
        </div>
        
        <div class="form-group">
            <label for="longExchange">Биржа (Long)</label>
            <select id="longExchange" required>
                <option value="" disabled selected>Выберите биржу</option>
                <option value="Binance">Binance</option>
                <option value="Bybit">Bybit</option>
                <option value="OKX">OKX</option>
                <option value="Gate">Gate</option>
                <option value="MEXC">MEXC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="longPrice">Цена (Long)</label>
            <input type="number" id="longPrice" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="separator"></div>

        <!-- Short Position -->
        <div class="section-title">
            <span class="section-icon">📉</span>
            <span>Short Position</span>
        </div>

        <div class="form-group">
            <label for="shortExchange">Биржа (Short)</label>
            <select id="shortExchange" required>
                <option value="" disabled selected>Выберите биржу</option>
                <option value="Binance">Binance</option>
                <option value="Bybit">Bybit</option>
                <option value="OKX">OKX</option>
                <option value="Gate">Gate</option>
                <option value="MEXC">MEXC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="shortPrice">Цена (Short)</label>
            <input type="number" id="shortPrice" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div class="separator"></div>

        <!-- Volume -->
        <div class="section-title">
            <span class="section-icon">💰</span>
            <span>Volume</span>
        </div>
        
        <div class="form-group">
            <label for="volume">Объем</label>
            <input type="number" id="volume" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <!-- Submit Button -->
        <button id="submitBtn" onclick="submitForm()">Отправить данные</button>

        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        
        // Инициализация Mini App
        tg.expand();
        tg.MainButton.hide();
        
        // Настройка цветов темы
        document.body.style.background = tg.themeParams.bg_color || '#ffffff';
        document.body.style.color = tg.themeParams.text_color || '#000000';

        // Функция для установки токена из подсказок
        function setToken(token) {
            document.getElementById('token').value = token;
        }

        // Функция для получения CSRF токена (если нужен)
        function getCsrfToken() {
            return document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '';
        }

        // Функция валидации формы
        function validateForm() {
            const token = document.getElementById('token').value.trim();
            const longExchange = document.getElementById('longExchange').value;
            const longPrice = document.getElementById('longPrice').value;
            const shortExchange = document.getElementById('shortExchange').value;
            const shortPrice = document.getElementById('shortPrice').value;
            const volume = document.getElementById('volume').value;

            // Проверка токена
            if (!token) {
                throw new Error('Пожалуйста, укажите токен или торговую пару');
            }

            // Проверка остальных полей
            if (!longExchange || !longPrice || !shortExchange || !shortPrice || !volume) {
                throw new Error('Пожалуйста, заполните все поля');
            }

            if (parseFloat(longPrice) <= 0 || parseFloat(shortPrice) <= 0 || parseFloat(volume) <= 0) {
                throw new Error('Цены и объем должны быть больше нуля');
            }

            return {
                token: token.toUpperCase(), // Приводим к верхнему регистру для единообразия
                longExchange,
                longPrice: parseFloat(longPrice),
                shortExchange,
                shortPrice: parseFloat(shortPrice),
                volume: parseFloat(volume)
            };
        }

        // Функция отправки данных в n8n
        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            try {
                // Валидация
                const formData = validateForm();
                
                // Блокируем кнопку
                submitBtn.disabled = true;
                
                // Показываем статус загрузки
                statusDiv.className = 'status-message loading';
                statusDiv.textContent = 'Отправка данных...';

                // Добавляем метаданные Telegram
                const payload = {
                    ...formData,
                    telegram_init_data: tg.initData || '',
                    user: tg.initDataUnsafe?.user || null,
                    chat: tg.initDataUnsafe?.chat || null,
                    timestamp: new Date().toISOString(),
                    source: 'telegram_mini_app'
                };

                // ЗАМЕНИТЕ ЭТОТ URL НА ВАШ WEBHOOK URL ИЗ N8N
                const response = await fetch('https://gitnickolay.app.n8n.cloud/webhook/e9b928a3-3361-455a-a4bd-541d8fddf0a3', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': getCsrfToken()
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                
                // Успешная отправка
                statusDiv.className = 'status-message success';
                statusDiv.textContent = '✅ Данные успешно отправлены!';
                
                // Вибрация на телефоне
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                // Опционально: показываем уведомление в Telegram
                tg.showPopup({
                    title: 'Успех',
                    message: 'Данные успешно отправлены в n8n',
                    buttons: [{type: 'ok'}]
                });

            } catch (error) {
                console.error('Error:', error);
                
                // Показываем ошибку
                statusDiv.className = 'status-message error';
                statusDiv.textContent = `❌ Ошибка: ${error.message}`;
                
                // Вибрация на телефоне
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }

                // Показываем popup с ошибкой
                tg.showPopup({
                    title: 'Ошибка',
                    message: error.message,
                    buttons: [{type: 'close'}]
                });
            } finally {
                // Разблокируем кнопку через небольшую задержку
                setTimeout(() => {
                    submitBtn.disabled = false;
                }, 2000);
            }
        }

        // Добавляем поддержку Enter для отправки формы
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitForm();
            }
        });

        // Валидация на лету для поля токена (разрешаем только буквы, цифры и слэш)
        document.getElementById('token').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9/]/g, '').toUpperCase();
        });

        // Автоматическое форматирование цены (не даем вводить больше 2 знаков после запятой)
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value) {
                    this.value = parseFloat(this.value).toFixed(2);
                }
            });
        });

        // Закрываем Mini App при необходимости
        function closeApp() {
            tg.close();
        }

        // Показываем предупреждение при попытке закрыть страницу
        window.addEventListener('beforeunload', function (e) {
            if (document.getElementById('submitBtn').disabled) {
                e.preventDefault();
                e.returnValue = 'Данные отправляются. Пожалуйста, подождите...';
            }
        });

        // Обработка кнопки назад в Telegram
        tg.onEvent('backButtonClicked', function() {
            if (confirm('Закрыть приложение?')) {
                tg.close();
            }
        });
    </script>
</body>
    </html>
